<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hilda Senpai | Links 18+</title><style> *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#351443,#110817 65%);color:#fceaff;font:16px system-ui,sans-serif;padding:24px}main{width:min(100%,420px);text-align:center}h1{color:#e6bbff;font-size:30px}p{color:#d5afd9;line-height:1.6}button,a{font:inherit}button,.link{display:block;width:100%;padding:16px;margin:12px 0;border:1px solid #9f42ce;border-radius:16px;background:#261034;color:#fceaff;text-decoration:none;font-weight:600;cursor:pointer}.primary{background:#cd68f8;color:#230c2c}.lang{width:auto;margin-left:auto;padding:8px 12px;font-size:12px}.link[aria-disabled=true]{opacity:.55;cursor:default}small{color:#d5afd9} [hidden]{display:none!important}</style></head><body><main><button class="lang" id="lang">PT / EN</button><h1>Hilda Senpai ♡</h1><section id="gate"><h2 id="question"></h2><p id="notice"></p><button class="primary" id="yes"></button><button id="no"></button></section><section id="links" hidden><p id="intro"></p><div id="items"></div><small id="note"></small></section><p id="denied" hidden></p></main><script>
// Configure somente destinos autorizados para divulgação. Use URLs HTTPS completas.
const entries=[{pt:'Privacy',en:'Privacy',url:''},{pt:'Telegram VIP',en:'Telegram VIP',url:''},{pt:'Telegram Free',en:'Telegram Free',url:''},{pt:'Privacy grátis',en:'Free Privacy',url:''}];
const words={pt:['Você tem 18 anos ou mais?','Esta página reúne links para conteúdo destinado a adultos.','Sim, tenho 18 anos ou mais','Não, voltar','Conteúdos e comunidades • 18+','Links ainda não configurados.','Acesso não autorizado.'],en:['Are you 18 or older?','This page contains links to adult-only content.','Yes, I am 18 or older','No, go back','Content and communities • 18+','Links not configured yet.','Access not authorized.']};let language=/^pt/i.test(navigator.language)?'pt':'en';const $=id=>document.getElementById(id);function render(){document.documentElement.lang=language==='pt'?'pt-BR':'en';['question','notice','yes','no','intro','note','denied'].forEach((id,i)=>$(id).textContent=words[language][i]);$('items').replaceChildren();for(const e of entries){const a=document.createElement('a');a.className='link';a.textContent=e[language];if(/^https:\/\//i.test(e.url)){a.href=e.url;a.rel='noopener noreferrer'}else{a.setAttribute('aria-disabled','true')} $('items').append(a)}$('note').hidden=entries.every(e=>/^https:\/\//i.test(e.url))} $('lang').onclick=()=>{language=language==='pt'?'en':'pt';render()};$('yes').onclick=()=>{$('gate').hidden=true;$('links').hidden=false};$('no').onclick=()=>{$('gate').hidden=true;$('denied').hidden=false};render();</script></body></html>
