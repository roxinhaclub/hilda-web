<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://hildasenpai.com/">
  <title>Hilda Senpai — Redirect</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#130b1c; color:#f0d3ff; font:16px system-ui,sans-serif; text-align:center; }
    main { padding:24px; } a { color:#df8bff; } p { line-height:1.6; }
  </style>
  <script>window.location.replace('https://hildasenpai.com/');</script>
</head>
<body>
  <main>
    <p id="message">Redirecting…</p>
    <a id="continue" href="https://hildasenpai.com/">Continue to Hilda Senpai</a>
  </main>
  <script>
    if (/^pt(?:-|$)/i.test(navigator.language || '')) {
      document.documentElement.lang = 'pt';
      document.getElementById('message').textContent = 'Redirecionando…';
      document.getElementById('continue').textContent = 'Continuar para Hilda Senpai';
    }
  </script>
</body>
</html>
