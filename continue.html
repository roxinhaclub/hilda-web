<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#110817"><title>Hilda Senpai ♡</title><link rel="icon" href="favicon.svg"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 20%,#42164f,transparent 65%),#110817;color:#fceaff;font-family:'DM Sans',sans-serif;text-align:center}main{width:min(100%,420px);padding:32px 24px;border:1px solid #9f42ce;border-radius:30px;background:#211029;box-shadow:0 0 32px #b64ae045}h1{font:400 32px 'Pacifico',cursive;color:#f0a1ff;margin:12px 0}p{line-height:1.55;color:#e6bbff}img{width:110px;height:110px;object-fit:contain;margin:auto;filter:drop-shadow(0 0 14px #b64ae0)}button.cta{width:100%;border:0;font:inherit;display:block;padding:16px 12px;border-radius:50px;background:linear-gradient(100deg,#cd65f4,#e486ff);color:#230c2c;font-weight:800;text-decoration:none;box-shadow:0 0 18px #c14def80;margin:24px 0 12px}button{font:inherit;color:#e6bbff;background:transparent;border:1px solid #8745a8;border-radius:30px;padding:8px 14px;cursor:pointer}small{display:block;line-height:1.5;color:#d5afd9;overflow-wrap:anywhere}aside{margin-top:20px;padding:12px;border:1px solid #8745a8;border-radius:14px}aside[hidden]{display:none}a:focus-visible,button:focus-visible{outline:2px solid white;outline-offset:4px}
dialog{width:min(calc(100% - 32px),390px);border:1px solid #9f42ce;border-radius:24px;padding:26px;background:#211029;color:#fceaff;text-align:center;box-shadow:0 0 32px #b64ae045}dialog::backdrop{background:#08040bd9}dialog h2{margin:0 0 12px}dialog button{width:100%;min-height:48px}dialog .cta{margin:16px 0 10px} </style></head><body><main><img src="puppy-footer.png" alt="" onerror="this.hidden=true"><h1>Hilda Senpai ♡</h1><p id="intro">You're almost there!</p><button class="cta" id="go" type="button">Visit my website ↗</button><aside id="browser" hidden><p id="notice"></p><small id="instructions"></small></aside><p><button id="lang" type="button">PT / EN</button></p></main><dialog id="age" aria-labelledby="ageTitle" aria-describedby="ageText"><h2 id="ageTitle"></h2><p id="ageText"></p><button class="cta" id="yes" type="button"></button><button id="no" type="button"></button></dialog><script>
const params=new URLSearchParams(location.search);let lang=['pt','en'].includes(params.get('lang'))?params.get('lang'):(/^pt(?:-|_|$)/i.test(navigator.language)?'pt':'en');const ua=navigator.userAgent;const instagram=/Instagram/i.test(ua);const android=/Android/i.test(ua);const ios=/iPhone|iPad|iPod/i.test(ua);const go=document.getElementById('go');const destination='https://imhilda.com/redi';const browser=document.getElementById('browser');browser.hidden=!instagram;
function render(){const pt=lang==='pt';document.documentElement.lang=pt?'pt-BR':'en';document.getElementById('intro').textContent=pt?'Você está quase lá!':'You’re almost there!';go.textContent=instagram&&android?(pt?'Continuar no navegador ↗':'Continue in browser ↗'):(pt?'Acessar meu site ↗':'Visit my website ↗');document.getElementById('notice').textContent=pt?'Para uma melhor experiência, abra esta página no navegador externo.':'For a better experience, open this page in your external browser.';document.getElementById('instructions').textContent=pt?'Toque nos três pontinhos do Instagram e escolha Abrir no navegador externo. Depois, toque em Acessar meu site.':'Tap Instagram’s three-dot menu and choose Open in external browser. Then tap Visit my website.';if(instagram && !android){document.getElementById('notice').textContent=pt?'Você pode continuar por aqui.':'You can continue here.';document.getElementById('instructions').textContent=pt?'Se preferir, toque nos três pontinhos e escolha abrir no navegador externo.':'If you prefer, use the three-dot menu to open in an external browser.';}document.getElementById('lang').textContent=pt?'PT / EN':'EN / PT';document.getElementById('ageTitle').textContent=pt?'Você tem 18 anos ou mais?':'Are you 18 or older?';document.getElementById('ageText').textContent=pt?'O destino contém links para conteúdo destinado exclusivamente a adultos.':'The destination contains links to adult-only content.';document.getElementById('yes').textContent=pt?'Sim, tenho 18 anos ou mais':'Yes, I am 18 or older';document.getElementById('no').textContent=pt?'Não, voltar':'No, go back';}document.getElementById('lang').onclick=()=>{lang=lang==='pt'?'en':'pt';render();if(location.protocol!=='file:'){const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url);}};render();
const age=document.getElementById('age');
go.addEventListener('click',()=>age.showModal());
document.getElementById('no').addEventListener('click',()=>age.close());
document.getElementById('yes').addEventListener('click',()=>{
 age.close();
 if(instagram && android){
    const url=new URL(location.href);
    url.searchParams.set('lang',lang);
    if(url.protocol !== 'https:') return;
    document.getElementById('notice').textContent=lang==='pt'?'Tentando abrir o navegador externo… Confirme se aparecer um aviso.':'Trying to open your external browser… Confirm if prompted.';
    const fallback=encodeURIComponent(url.href);
    location.href='intent://' + url.host + url.pathname + url.search + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.android.chrome;S.browser_fallback_url=' + fallback + ';end';
 }else{location.assign(destination);}
});
</script></body></html>
